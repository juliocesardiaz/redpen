<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ASSIGNMENT_NAME}} — {{STUDENT_NAME}}</title>
  <style>
    /* highlight.js theme CSS inlined here */
{{THEME_STYLES}}

    /* All viewer CSS inlined here */
{{STYLES}}
  </style>
</head>
<body>
  <header class="redpen-header">
    <div class="meta">
      <h1 class="assignment">{{ASSIGNMENT_NAME}}</h1>
      <p class="student">{{STUDENT_NAME}}</p>
    </div>
    {{SCORE_BLOCK}}
  </header>

  {{OVERALL_COMMENT}}

  <!-- One-time discoverability hint; the runtime shows it only when the
       submission has annotations and hides it permanently once dismissed
       or once any highlight is clicked. -->
  <div id="viewer-hint" class="viewer-hint hidden" role="status">
    <span aria-hidden="true">💡</span>
    <span>Click highlighted code to read your teacher's feedback</span>
    <button id="viewer-hint-dismiss" class="viewer-hint-dismiss" type="button" aria-label="Dismiss hint">×</button>
  </div>

  <main class="code-view">
    <pre class="code-pre"><code class="code-lines hljs">{{CODE_BODY}}</code></pre>
  </main>

  <!-- Footnotes for print mode -->
  <div class="print-annotations hidden-screen" id="print-annotations">
    {{PRINT_ANNOTATIONS}}
  </div>

  <footer class="viewer-footer">graded with <span class="viewer-footer-brand">redpen</span></footer>

  <!-- Prev/next walk through annotations in document order; the runtime
       unhides it when there are at least two. -->
  <nav id="anno-nav" class="anno-nav hidden" aria-label="Annotation navigation">
    <button id="anno-nav-prev" class="anno-nav-btn" type="button" aria-label="Previous annotation">‹</button>
    <span id="anno-nav-counter" class="anno-nav-counter" aria-live="polite"></span>
    <button id="anno-nav-next" class="anno-nav-btn" type="button" aria-label="Next annotation">›</button>
  </nav>

  <div class="tooltip hidden" id="tooltip">
    <span class="tooltip-arrow" aria-hidden="true"></span>
    <div id="tooltip-content" class="tooltip-content"></div>
  </div>

  <script type="application/json" id="submission-data">
    {{DATA}}
  </script>

  <script>
    /* All viewer JS inlined here */
{{HIGHLIGHT_JS}}

{{VIEWER_RUNTIME_JS}}
  </script>
</body>
</html>
